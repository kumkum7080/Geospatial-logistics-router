version: '3.8'

services:
  # 1. HOT LAYER: High-speed In-Memory Cache
  redis:
    image: redis:7.2-alpine
    container_name: logistics_hot_redis
    ports:
      - "6379:6379"
    restart: always

  # 2. CONVEYOR BELT: Kafka Stream Engine
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. COLD LAYER: Local Object Storage Data Lake (Simulating Amazon S3)
  minio:
    image: minio/minio
    container_name: logistics_cold_s3
    ports:
      - "9000:9000" # Data API
      - "9001:9001" # Web Dashboard UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    command: server /data --console-address ":9001"

  # 4. WARM STORAGE: Relational Database System (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: logistics_mysql
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "K@shish@2005"
      MYSQL_DATABASE: "geospatial_routing_system"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: